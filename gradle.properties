# =============================================================================
# gradle.properties — JVM settings for the Gradle build itself.
#
# -Xmx2g : max heap for the Gradle daemon. Plenty for this project; raise it on a
#          beefy machine (RockyGo uses -Xmx4g) if you ever hit an OOM error.
#
# The long --add-exports lines are for kapt (annotation processing) on JDK 17+.
# Modern JDKs lock down javac internals that kapt needs. RockyGo's
# gradle.properties carries the exact same workaround - do not "clean them up",
# the build breaks without them.
#
# Each run-on line MUST stay on one physical line: .properties files treat a
# trailing backslash as line continuation and would mangle these flags.
# =============================================================================

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
kotlin.daemon.jvmargs=-Xmx1g --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED

org.gradle.daemon=true
org.gradle.parallel=true

kotlin.code.style=official
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
