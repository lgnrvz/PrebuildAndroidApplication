// =============================================================================
// app/build.gradle — the app module: SDK versions, build types, dependencies.
//
// ONBOARDING NOTE
// ----------------
// `namespace` (below) is the package name the resource compiler uses. Since AGP 8
// it REPLACES the old `package="..."` attribute in AndroidManifest.xml — if you
// see both, delete the manifest one or the build fails.
//
// Every dependency here has exactly one version, and that version was chosen to
// match what the Trackerteer apps (RockyGo) run in production, so the code you
// write here transfers 1:1 to real projects.
// =============================================================================

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'                            // annotation processing: Room + Hilt
    id 'com.google.dagger.hilt.android'         // dependency injection
}

android {
    namespace 'com.nrvz.prebuildapplication'
    compileSdk 35

    defaultConfig {
        applicationId "com.nrvz.prebuildapplication"
        minSdk 24
        targetSdk 35
        versionCode 2
        // HOUSE RULE: bump versionName on EVERY push, never versionCode.
        // It is what we check (Settings / screen footer) to prove the APK you
        // just installed is the build you just pushed. A stale APK has burned
        // this team before.
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ---- BuildConfig fields -----------------------------------------------
        // Teaching point: values that differ per environment/setup belong HERE,
        // not hardcoded in Kotlin. Read them as `BuildConfig.BASE_API_URL`.
        // Real secrets never go in git - they live in a gitignored
        // `secrets.properties` (read at build time) or a CI environment variable.
        // RockyGo goes further and declares these per product flavor (dev /
        // staging / production) so ONE codebase ships to several back ends.
        buildConfigField "String", "BASE_API_URL", '"https://jsonplaceholder.typicode.com/"'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ---- BuildConfig fields -------------------------------------------------
    // (declared in defaultConfig above, next to the version)

    buildFeatures {
        dataBinding true      // <layout> XML can bind straight to your ViewModel
        viewBinding true      // typed binding classes even without <layout>
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // ---------- AndroidX / UI ----------
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    // ---------- Lifecycle: ViewModel + LiveData ----------
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'  // gives LiveData.map / .switchMap
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // ---------- Coroutines ----------
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // ---------- Room (local database) ----------
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'          // suspend + Flow support
    kapt 'androidx.room:room-compiler:2.6.1'

    // ---------- Hilt (dependency injection) ----------
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-compiler:2.51.1'

    // ---------- Retrofit / OkHttp (network) ----------
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // ---------- Logging ----------
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // ---------- Encrypted SharedPreferences ----------
    implementation 'com.scottyab:secure-preferences-lib:0.1.7'

    // ---------- Tests ----------
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
