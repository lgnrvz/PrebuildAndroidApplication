// =============================================================================
// Root build.gradle — plugin versions for the WHOLE project.
//
// ONBOARDING NOTE
// ----------------
// Each plugin is declared here with `apply false`, which means "make this plugin
// available to modules, but don't apply it to the root project". The `app`
// module then applies them by id in its own build.gradle.
//
// That is the modern replacement for the old `buildscript { classpath ... }`
// style you will still see in RockyGo's root build.gradle. Both work; this one
// makes the version live in exactly one place and lets Gradle resolve plugins
// through `pluginManagement` in settings.gradle.
//
// RULE: bump a version ONLY here. Never hardcode a library version in two files.
// =============================================================================

plugins {
    id 'com.android.application' version '8.6.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    id 'com.google.dagger.hilt.android' version '2.51.1' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
